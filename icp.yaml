# Ideal Customer Profile and offer (v2). The agents read this file.
version: 6

company:
  name: Zypher Software Solutions LLP
  location: Kerala, India
  positioning: >
    We build SOFTWARE automations for small and mid-sized businesses: we find the
    repetitive office work (chasing clients and enquiries, updating Notion or the CRM by hand,
    copying data between email, WhatsApp and spreadsheets, reports) and make it run on its own
    with integrations and AI agents. Software only: no robots, machinery or hardware.
  primary_service: business-process automation
  secondary_services: [websites, mobile apps, CRM/ERP/POS/custom software, branding and rebranding]

strategy:
  model: land_and_expand
  goal_of_outreach: get a reply, then book a discovery call (15-20 min) to understand their workflow
  first_touch_rule: >
    Pitch ONLY the first-touch offer (see offers). Never mention the other offers.
    Do not ask for a call or a meeting. Open with one specific observation about their
    business, then ask one easy yes/no question that offers a one-page sketch of how it
    could be improved, with no call needed. The call comes after they reply. Gaps found in
    other areas (website, branding, software) are raised during the call, never in email.
  discovery_call_outputs: [workflow map, time/cost waste estimate, gaps in web/software]

target:
  company_size: "10-200 employees"
  markets: [UAE, India, Qatar, US]
  industry_policy: >
    ANY industry. We do not target a sector, we target a KIND OF COMPANY: an established business
    with a proper office and an office team (sales, accounts, procurement, admin, project or
    operations coordinators) whose day-to-day flow is real but messy: quotations, enquiries,
    orders, contracts and invoices handled through spreadsheets, WhatsApp, email and retyping.
    They already want a proper flow; they just have not built it. We automate the OFFICE work
    of the company, never its products. A company that sells hardware or runs sites is fine.
    We are NOT for freelancers, one-person operations, informal or social-media-only businesses,
    shops serving walk-in customers, or anyone without a proper office and formal paperwork.
    The research agent must find evidence of a specific workflow pain for each lead. Every lead
    is tagged with its industry so we can measure which sectors reply and book calls.
  # Our one finished deployment (a lighting supplier: one-click quotations in its own template from a drawing)
  # is an EXAMPLE of the kind of company, not a sector. Facts about it are not stated to the model until confirmed.
  qualifying_structure:     # evidence that the company is the KIND we serve; the research agent looks for it
    - a registered company with a real office (address, trade licence, several branches or departments)
    - an office team beyond the owner (sales, accounts, procurement, admin, HR, project or operations coordinators)
    - formal paperwork such as quotations, proposals, contracts, purchase orders, invoices and tenders
    - roughly 10 to 200 staff (a team or about page, a careers page, many named people or roles)
  # A proof quote only counts if it NAMES something concrete. A slogan ("our professional team"), an address
  # or "contact us for a catalogue" proves nothing. Whole words, plurals allowed.
  proof_words:
    office_team: [sales, accounts, accountant, accounting, procurement, purchasing, administration, admin, finance,
                  HR, human resources, coordinator, project manager, estimator, estimating, quantity surveyor,
                  engineer, department, branch, employee, reception, customer service, account manager]
    business_side: [quotation, quote, tender, RFQ, project, contract, contractor, wholesale, trade, bulk, B2B,
                    corporate, dealer, distributor, consultant, purchase order, supplier, enterprise]
  good_signals:
    - quotes or proposals are sent and then chased by hand (no tracking or automatic follow-up)
    - clients get project, order or delivery status updates by phone, WhatsApp or email
    - enquiries come through a form, email or WhatsApp and are copied into Excel, a CRM or Notion
    - a sales or project team that reports upward through spreadsheets
    - quotes or proposals are built manually (Excel/Word/PDF)
    - orders, leads or enquiries come through WhatsApp/email/forms with no CRM
    - hiring for admin, operations, coordinator or data-entry roles
    - multiple branches, salespeople or high enquiry volume
    - outdated website, no enquiry form, booking or quote request flow
  disqualifiers:
    - large enterprise or listed company
    - IT/automation/software vendor or agency
    - no verifiable website or business email
    - freelancer, one-person business, or an informal or social-media-only business with no office team
    - shop or clinic serving walk-in customers only, with no business-to-business or project side

buyer_personas:
  - owner / founder / managing director
  - operations manager / general manager
  - head of sales

offer:
  first_touch_cta: "Offer to send a one-page sketch of how the workflow could be automated, no call needed"
  primary_cta: "Free discovery call (15-20 min), no commitment, to understand how your business runs today"
  value_claims_allowed:        # qualitative only, until we have measured results
    - saves staff time on repetitive work
    - fewer manual errors
    - faster response to customers
  pricing_note: "TODO: not stated in first touch. Decide pilot vs project pricing for the call."

proof_points:
  # HONESTY RULES: Zypher has NO external paying clients yet for automation.
  # Never imply a client base. USR is a family-owned company (founder's brother),
  # so it is our first deployment, not an independent customer. Never hide this
  # if asked, and never present it as an independent third-party result.
  - id: usr_first_deployment
    text: "Our first deployment: automations built for USR, a Dubai company"
    relationship: "owned by the founder's brother"
    disclose_if_asked: true
    may_name_client: false      # TODO: confirm with USR owner before naming in emails
    never_name: [USR]           # the guardrails reject these words in any email while may_name_client is false
    safe_wording: "a Dubai company we built it for"
    details_needed: [what was automated, before vs after, measured time/error savings, screenshots or demo OK to share]
    allowed_metrics: []         # add only verified, real numbers
  - id: zypher_internal
    text: "We run our own operations on automation, e.g. Notion CRM connected to Slack"
    strength: supporting
forbidden_proof:
  - Instagram or social media marketing results (a plan, not a result)
  - any client, number or result not listed above
  - phrases like "our clients", "we have helped companies", "proven results" (we have one deployment)

messaging_rules:
  email_word_range: [50, 80]
  tone: plain, human, specific, no hype
  must_include: [one specific observation about THEIR workflow, one low-friction CTA, opt-out line]
  never_say: ["I hope this email finds you well", "revolutionary", "game-changing", "guarantee", "boost your digital presence", "robot", "hardware", "internet of things"]
  never_claim: [clients, revenue, time-saved numbers or results not in proof_points]
  hypothesis_style: "phrase as a question or likelihood, not as a fact about their business"

# What the business sells. Exactly one is pitched in a first touch; the rest wait for the call.
# Written as "we do X through Y so that Z". avoid_patterns are regexes the guardrails reject in a first touch.
offers:
  - id: automation
    name: Business-process automation
    first_touch: true
    evidence_focus: >
      manual client handling: following up on quotes and enquiries, keeping the CRM or Notion
      updated by hand, project or order status updates, reports, and data copied by hand between
      email, WhatsApp, spreadsheets and other tools
    value_statement: >
      We build software automations that take repetitive office work off your team: following up
      with clients and enquiries automatically, keeping your CRM or Notion up to date without
      retyping, turning enquiries and quotes into tracked tasks, and sending reminders and
      reports. They connect to the tools you already use (email, WhatsApp, Excel, Notion, your
      CRM) and run on their own, so you do not need to hire for it. This is software only:
      never mention robots, machinery, sensors or hardware. You may name email, WhatsApp, Excel, Notion or a
      CRM as tools they already use, but never offer to build any of them.
  - id: software
    name: Websites, apps and custom software
    first_touch: false
    value_statement: We build the websites, apps and CRM/ERP systems a business needs.
    avoid_patterns:
      - 'redesign|new website|website development|web development|app development'
      - 'build (you |your )?(a |an |the )?(new )?(website|site|app|mobile app)'
      - 'rebuild (your |the )?(website|site)'
  - id: branding
    name: Branding and rebranding
    first_touch: false
    value_statement: We take over a company's branding, or rebrand it end to end.
    avoid_patterns:
      - '\brebrand(ing)?\b|\bbrand identity\b|\blogo\b|\bbranding\b'

# The follow-up sequence after the first touch. `kind` selects the platform rules that apply (what the email
# must contain), `angle` tells the writer what is new in this step. Delays count working days in the LEAD's
# country after the previous email was sent. Every step needs the owner's approval while autonomy level is 0.
sequence:
  - step: 2
    kind: new_angle
    delay_business_days: 3
    angle: >
      A DIFFERENT observation about their business than the first email used (use another evidence item).
      Add one new idea only. Do not repeat or refer to the first email's wording.
  - step: 3
    kind: referral
    delay_business_days: 5
    angle: >
      Ask who at the company looks after this kind of work, in one easy question. You may add one short
      sentence of our honest proof wording ("a Dubai company we built it for") and nothing else about results.
  - step: 4
    kind: breakup
    delay_business_days: 9
    angle: >
      A short, kind last note: say this is the last email, and offer three one-character replies:
      1 = interested, 2 = not now, 3 = please stop. Then leave the door open. Do not ask a question.
